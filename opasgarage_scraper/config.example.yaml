# =====================================================================
# Configuração do scraper do Opas Garage
# Copie este arquivo para "config.yaml" e ajuste os valores.
#   cp config.example.yaml config.yaml
# =====================================================================

base_url: "https://opasgarage.com.br"

# ---------------------------------------------------------------------
# DESCOBERTA DE POSTS
# O scraper tenta, nesta ordem:
#   1) Sitemaps automáticos (sitemap.xml, wp-sitemap.xml, etc.)
#   2) Varredura das páginas de listagem abaixo (blog, categorias...)
# ---------------------------------------------------------------------

# Páginas de listagem para varrer procurando links de posts.
# A descoberta tenta o sitemap automaticamente; estas páginas são um reforço.
listing_urls:
  - "https://opasgarage.com.br/area-do-assinante"

# Regex que identifica a URL de UM POST.
# Os posts do Opas Garage ficam em /ANO/MES/nome.html
#   ex.: https://opasgarage.com.br/2026/06/scintilla.html
post_url_pattern: '/20\d{2}/\d{2}/[^/]+\.html$'

# Como avançar nas páginas de listagem (paginação):
#   - segue links cujo texto/atributo indiquem "próxima" página
next_page_selector: "a[rel='next'], a.next, .pagination a.next"
max_listing_pages: 100   # teto de páginas de listagem a percorrer

# ---------------------------------------------------------------------
# EXTRAÇÃO DO CONTEÚDO DE CADA POST
# Se deixar os seletores vazios, o extrator inteligente (trafilatura)
# tenta identificar título, texto, autor e data sozinho.
# Preencha para refinar quando algo vier errado.
# ---------------------------------------------------------------------
selectors:
  title: ""       # ex: "h1.entry-title"
  content: ""     # ex: "div.entry-content"
  author: ""      # ex: ".author, .byline a"
  date: ""        # ex: "time, .published"
  category: ""    # ex: ".cat-links a, .post-category a"

# ---------------------------------------------------------------------
# COMPORTAMENTO
# ---------------------------------------------------------------------
delay_seconds: 2.0        # pausa entre páginas (educação com o servidor)
max_posts: 2000           # teto de segurança
headless_scrape: false    # false = janela visível (recomendado se houver anti-bot)
download_images: true     # baixar as imagens dos posts para data/images/
browser_channel: "chrome" # "chrome" usa o Google Chrome instalado (melhor p/ login Google);
                          # deixe "" para usar o Chromium do Playwright.

# ---------------------------------------------------------------------
# LOGIN VIA GOOGLE / 2FA  (IMPORTANTE)
#
# RECOMENDADO — método COOKIES: o Google bloqueia login em navegadores
# automatizados/depuração. Então você loga no site no seu Chrome NORMAL,
# exporta os cookies (extensão "Cookie-Editor") para o arquivo abaixo, e o
# scraper reaproveita a sessão. Passo a passo no README.
cookies_file: "cookies.json"       # arquivo com os cookies exportados

# Alternativa — método CDP (conectar a um Chrome com depuração aberta).
# Costuma esbarrar no bloqueio do Google; deixe use_cdp: false e use cookies.
use_cdp: false
cdp_url: "http://localhost:9222"
